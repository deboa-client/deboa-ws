[package]
name = "deboa-ws"
version = "0.1.0"
edition = "2021"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/ararog/deboa-ws"
homepage = "https://github.com/ararog/deboa"
description = "A friendly rest client on top of hyper."
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "networking", "client", "fetch", "rest-client"]
publish = true
rust-version = "1.85.0"

[features]
default = ["runtime-smol"]
runtime-tokio = ["dep:tokio", "hyper-util/tokio"]
runtime-smol = ["dep:smol", "dep:smol-hyper"]

[dependencies]
base64 = { version = "0.23" }
deboa = { version = "0.1.5" }
http = "1"
hyper = { version = "1", features = ["client"], default-features = false }
hyper-util = { version = "0.1", features = [
  "client",
  "client-legacy",
], default-features = false }
pin-project-lite = "0.2"
rand = "0.10"
smol = { version = "2.0.2", optional = true, default-features = false }
smol-hyper = { version = "0.1.0", optional = true, default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54", optional = true, features = ["io-std", "parking_lot"] }
ws-framer = { version = "0.4" }
